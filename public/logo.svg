<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="apBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Pulse Wave & Lift Gradient -->
    <linearGradient id="apPulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="apGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="apGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14B8A6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#apBgGrad)" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Diagnostic Conversion Pulse Path -->
  <path d="M 22 62 L 38 62 L 46 76 L 56 34 L 66 70 L 74 54 L 84 54" 
        fill="none" 
        stroke="url(#apPulseGrad)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#apGlow)"/>

  <!-- Upward Conversion Lift Arrowhead / Growth Spark -->
  <path d="M 72 40 L 92 36 L 88 56" 
        fill="none" 
        stroke="url(#apPulseGrad)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <line x1="88" y1="38" x2="68" y2="58" stroke="url(#apPulseGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Precision Diagnostic Node Spark -->
  <circle cx="56" cy="34" r="5" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/>
  <circle cx="92" cy="36" r="3" fill="#FCD34D"/>
</svg>
